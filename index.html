<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NES Site Logbook</title>
  <meta name="theme-color" content="#1f3864">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="favicon-32.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NES Logbook">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: fixed top bar + scrollable screen + fixed bottom tab bar; one column, phone-first, capped width. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f6f9fd; --ink:#15233d; --muted:#5d6e8c;
  --line:#d8e1ef; --navy:#1f3864; --blue:#2e5496; --blue-soft:#e9f0fb; --accent:#2e5496;
  --ok:#2f7d4f; --ok-bg:#e7f3ec; --warn:#b4651b; --warn-bg:#f8eede; --crit:#c0392b; --crit-bg:#fbe9e7;
  --pending:#7a6516; --pending-bg:#f6f0d9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px; --shadow:0 1px 2px rgba(20,35,61,.06),0 6px 18px rgba(20,35,61,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1320; --surface:#141f33; --surface-2:#0f1a2c; --ink:#e7eefb; --muted:#93a6c6;
  --line:#243350; --navy:#9fbcee; --blue:#6d93d8; --blue-soft:#172540; --accent:#6d93d8;
  --ok:#59b57d; --ok-bg:#15301f; --warn:#d2924a; --warn-bg:#2f2514; --crit:#e4756a; --crit-bg:#331614;
  --pending:#cdb25a; --pending-bg:#2b2612; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1320; --surface:#141f33; --surface-2:#0f1a2c; --ink:#e7eefb; --muted:#93a6c6;
  --line:#243350; --navy:#9fbcee; --blue:#6d93d8; --blue-soft:#172540; --accent:#6d93d8;
  --ok:#59b57d; --ok-bg:#15301f; --warn:#d2924a; --warn-bg:#2f2514; --crit:#e4756a; --crit-bg:#331614;
  --pending:#cdb25a; --pending-bg:#2b2612; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;width:100%}
textarea{resize:vertical;min-height:62px;line-height:1.4}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

#shell{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,var(--navy),var(--blue));color:#fff;
  padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(20,35,61,.18)}
.logo{width:34px;height:34px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.bar .t{font-weight:700;letter-spacing:.2px;font-size:16px;line-height:1.1}
.bar .s{font-size:11px;opacity:.85;letter-spacing:.3px}
.syncchip{margin-left:auto;flex:none;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:100px;
  padding:5px 10px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.syncchip .dot{width:7px;height:7px;border-radius:50%;background:#cfd8ea}
.syncchip.synced .dot{background:#6ee7a0} .syncchip.syncing .dot{background:#ffd166;animation:pulse 1s infinite}
.syncchip.offline .dot{background:#ff8a7a} .syncchip.local .dot{background:#cfd8ea}
@keyframes pulse{50%{opacity:.35}}
.bar .proj{margin-left:8px;text-align:right;font-size:11px;max-width:34%;overflow:hidden;flex:none}
.bar .proj b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 96px;-webkit-overflow-scrolling:touch}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;max-width:720px;margin:0 auto;
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--accent)}

h2.title{font-size:20px;font-weight:700;margin:2px 0 3px;letter-spacing:-.2px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--blue);margin:20px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer;transition:transform .06s,border-color .12s}
.card.tap:active{transform:scale(.995)}
.card.tap.active{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent),var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.nowrap{white-space:nowrap}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{height:1px;background:var(--line);border:0;margin:12px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 15px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;line-height:1}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-ghost{background:var(--surface-2)}
.btn-danger{background:var(--crit-bg);border-color:transparent;color:var(--crit)}
.btn-sm{min-height:34px;padding:0 11px;font-size:13px;font-weight:600}
.btn-block{width:100%}
.btn:active{filter:brightness(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-add{width:100%;border:1.5px dashed var(--line);background:none;color:var(--blue);min-height:46px;border-radius:var(--r-sm);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}

.field{margin-bottom:11px}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.2px}
.field.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 8px;border-radius:100px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.prog{background:var(--blue-soft);color:var(--blue)}
.pill.ong{background:var(--pending-bg);color:var(--pending)} .pill.todo{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge{background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:11px;padding:2px 8px;border-radius:100px}
.sample{background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:10.5px;letter-spacing:.4px;padding:2px 7px;border-radius:5px;text-transform:uppercase}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:100px;padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer}
.chip:active{background:var(--blue-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.lineitem{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.lineitem:first-child{border-top:0}
.num{flex:none;width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--mono);margin-top:1px}
.iconbtn{flex:none;background:none;border:0;color:var(--muted);padding:6px;border-radius:7px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.iconbtn:active{background:var(--surface-2)}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.thumb{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:1/1}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(15,23,38,.82),transparent);color:#fff;font-size:10px;padding:12px 6px 4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;color:var(--muted);padding:34px 18px}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:8px}
.note{background:var(--blue-soft);border-left:3px solid var(--blue);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink);margin-bottom:12px}
.warnnote{background:var(--warn-bg);border-left:3px solid var(--warn)}

.scrim{position:fixed;inset:0;background:rgba(10,16,26,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(10,16,26,.3);animation:up .18s ease}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h .ht{font-weight:700;font-size:16px}
.sheet-b{padding:16px;overflow-y:auto}
.sheet-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}

.editor-h{display:flex;align-items:center;gap:10px;margin:-16px -16px 14px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}

#printview{position:fixed;inset:0;z-index:50;background:#fff;color:#111;overflow:auto;display:none}
#printview .pv-bar{position:sticky;top:0;background:var(--navy);color:#fff;display:flex;gap:9px;align-items:center;padding:10px 14px;z-index:2}
#printview .pv-bar .grow{font-weight:700}
.ls{max-width:820px;margin:0 auto;padding:22px 20px 60px;color:#14223b;font-size:12.5px}
.ls h1{font-size:19px;margin:0;color:#1f3864;letter-spacing:-.2px}
.ls .lead{font-family:var(--mono);font-size:11px;color:#5d6e8c;letter-spacing:.4px}
.ls .block{border:1px solid #cdd8ea;border-radius:10px;padding:12px 14px;margin:14px 0}
.ls .tbl{width:100%;border-collapse:collapse;margin:7px 0 2px;font-size:11.5px}
.ls .tbl th{background:#203864;color:#fff;text-align:left;padding:6px 8px;font-size:10px;letter-spacing:.4px;text-transform:uppercase;font-weight:700}
.ls .tbl td{border:1px solid #d8e1ef;padding:6px 8px;vertical-align:top}
.ls .tbl tr:nth-child(even) td{background:#f4f8fd}
.ls .secbar{background:linear-gradient(90deg,#1f3864,#2e5496);color:#fff;font-weight:700;padding:6px 10px;border-radius:7px;margin:16px 0 6px;font-size:12px;letter-spacing:.3px}
.ls .daybar{background:#e9f0fb;border:1px solid #cdd8ea;border-left:4px solid #2e5496;border-radius:7px;padding:8px 11px;margin:18px 0 8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.ls .daybar b{color:#1f3864}
.ls .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ls .pcell{border:1px solid #d8e1ef;border-radius:8px;overflow:hidden;background:#f4f8fd}
.ls .pcell img{width:100%;height:150px;object-fit:cover;display:block}
.ls .pcell .pc{padding:6px 8px;font-size:10.5px}
.ls .pcell .pc b{color:#c0392b;display:block;margin-bottom:2px}
.ls .sign{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.ls .sign .sg{border-top:1px solid #111;padding-top:4px;font-size:11px;margin-top:34px}
.ls .foot{margin-top:22px;border-top:2px solid #2e5496;padding-top:8px;text-align:center;color:#5d6e8c;font-size:10px}
.day-sec{page-break-inside:avoid}
.day-break{page-break-after:always}
@media print{ body{background:#fff} #shell,.tabbar,#printview .pv-bar{display:none!important}
  #printview{position:static;display:block!important} .ls{max-width:none;padding:0} }
</style>
</head>
<body>
<div id="shell">
  <header class="bar">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 13h6l-1 9 11-13h-7l1-7z" fill="#2e5496" stroke="#1f3864" stroke-width="1" stroke-linejoin="round"/></svg></span>
    <div><div class="t">NES Site Logbook</div><div class="s">NDRASAL ELECTRICAL SERVICE</div></div>
    <button class="syncchip local" id="syncChip" data-action="sync-info"><span class="dot"></span><span id="syncTxt">Local</span></button>
    <div class="proj" id="projTag" hidden></div>
  </header>
  <main class="screen" id="app"></main>
  <nav class="tabbar" id="tabs">
    <button data-action="tab" data-tab="projects" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects</button>
    <button data-action="tab" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v4M16 3v4M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>Daily Log</button>
    <button data-action="tab" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11M4 12h11M4 19h11M19 5h1M19 12h1M19 19h1"/></svg>Library</button>
    <button data-action="tab" data-tab="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>Export</button>
  </nav>
</div>

<div id="printview">
  <div class="pv-bar"><button class="btn btn-sm btn-ghost" data-action="close-print">Close</button>
    <span class="grow" id="pvTitle">Log Sheet</span>
    <button class="btn btn-sm" data-action="do-print">Print / Save PDF</button></div>
  <div class="ls" id="lsBody"></div>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<input type="file" id="projImport" accept="application/json,.json" hidden>

<script>
"use strict";
(function(){
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clean = o => JSON.parse(JSON.stringify(o));
const todayISO = () => new Date().toISOString().slice(0,10);
function withTimeout(p,ms){ return Promise.race([Promise.resolve(p),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}); }
function parseHM(s){ if(!/^\d{1,2}:\d{2}$/.test(s||"")) return null; const [h,m]=s.split(":").map(Number); if(h>24||m>59) return null; return h*60+m; }
function grossHrs(i,o){ let a=parseHM(i),b=parseHM(o); if(a==null||b==null) return null; let d=b-a; if(d<=0)d+=1440; return d/60; }
function netHrs(i,o,brk){ const g=grossHrs(i,o); return g==null?null:Math.max(0,g-(+brk||0)); }
function shiftStr(i,o,brk){ const g=grossHrs(i,o); if(g==null) return ""; const n=Math.max(0,g-(+brk||0));
  return `${i} – ${o} (${g.toFixed(1)} hrs less ${(+brk).toFixed(1)} hrs break = ${n.toFixed(1)} hrs)`; }
function toast(msg){ let t=$("#toast"); if(!t){t=document.createElement("div");t.id="toast";
  t.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:100px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:88%;text-align:center";
  document.body.appendChild(t);} t.textContent=msg; t.style.opacity="1"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity="0",1900); }

/* ---------- IndexedDB (offline cache: state blob + photo blobs) ---------- */
const IDB={_db:null};
IDB.open=function(){ return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open("nes_logbook",1); }catch(e){ return rej(e); }
  r.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv"); if(!db.objectStoreNames.contains("photos"))db.createObjectStore("photos"); };
  r.onsuccess=e=>{ IDB._db=e.target.result; res(); }; r.onerror=()=>rej(r.error); }); };
IDB.get=function(store,key){ return new Promise((res,rej)=>{ try{ const t=IDB._db.transaction(store,"readonly").objectStore(store).get(key); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error);}catch(e){rej(e);} }); };
IDB.set=function(store,key,val){ return new Promise((res,rej)=>{ try{ const t=IDB._db.transaction(store,"readwrite").objectStore(store).put(val,key); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error);}catch(e){rej(e);} }); };
IDB.del=function(store,key){ return new Promise(res=>{ try{ IDB._db.transaction(store,"readwrite").objectStore(store).delete(key).onsuccess=()=>res(); }catch(e){res();} }); };
IDB.allPhotos=function(){ return new Promise(res=>{ const out={}; try{ const c=IDB._db.transaction("photos","readonly").objectStore("photos").openCursor();
  c.onsuccess=e=>{ const cur=e.target.result; if(cur){out[cur.key]=cur.value;cur.continue();}else res(out); }; c.onerror=()=>res(out);}catch(e){res(out);} }); };

/* ---------- state + capability mode ---------- */
let S=null, memCache=false;
let MODE="local"; // "local" | "cloud"
let DBc=null, USERc=null, ASSETSc=null, DLc=null, SAMPLEc=null, AI=false;
let subs=[], pending={}, wTimers={};
const photoURLs={};
const ui={tab:"projects", projectId:null, dayId:null};

function defaultCompany(){ return {name:"Ndrasal Electrical Service",tagline:"Innovative Electrical Solutions",
  location:"Lorengau, Manus Province, PNG",phone:"+675 7223 8148",licence:"PNG Power Licence No. 1279/2021",
  ipa:"IPA Reg 6-344245",tin:"TIN 501007487",gst:"GST Reg VT167",company:"Company No. C1-1945"}; }
function emptyState(){ return {company:defaultCompany(),rateCard:[],people:[],shiftPresets:[],weather:[],statuses:[],scopeLib:[],materialsLib:[],plantLib:[],units:[],projects:[],days:[]}; }
function ensureDefaults(s){ s.company=(s.company&&s.company.name)?s.company:defaultCompany();
  s.weather=(s.weather&&s.weather.length)?s.weather:["Fine","Partly cloudy","Overcast","Showers","Rain","Windy"];
  s.statuses=(s.statuses&&s.statuses.length)?s.statuses:["Not started","In progress","Ongoing","Complete"];
  s.units=(s.units&&s.units.length)?s.units:["no.","lot","m","set","ea","roll","box","day"];
  ["rateCard","people","shiftPresets","scopeLib","materialsLib","plantLib","projects","days"].forEach(k=>{ if(!Array.isArray(s[k]))s[k]=[]; }); return s; }

function seed(){
  const pid=uid(), did=uid();
  return ensureDefaults({ company:defaultCompany(),
    rateCard:[{id:uid(),role:"Licensed Electrician / Site Supervisor",rate:35},{id:uid(),role:"Electrical Tradesman",rate:15},

function libraryDoc(){ return {company:S.company,rateCard:S.rateCard,people:S.people,shiftPresets:S.shiftPresets,weather:S.weather,statuses:S.statuses,scopeLib:S.scopeLib,materialsLib:S.materialsLib,plantLib:S.plantLib,units:S.units}; }
function applyLibrary(o){ ["company","rateCard","people","shiftPresets","weather","statuses","scopeLib","materialsLib","plantLib","units"].forEach(k=>{ if(o[k]!=null)S[k]=o[k]; }); ensureDefaults(S); }
function dayDoc(d){ return {projectId:d.projectId,date:d.date||"",weather:d.weather||"",note:d.note||"",scope:d.scope||[],labour:d.labour||[],materials:d.materials||[],photos:d.photos||[],_t:Date.now()}; }
function projDoc(p){ const o={}; Object.keys(p).forEach(k=>{ if(k!=="id")o[k]=p[k]; }); return o; }

function mirrorLocal(){ if(IDB._db && !memCache){ IDB.set("kv","state",clean(S)).catch(()=>{}); } }
function saveLib(){ mirrorLocal(); if(MODE==="cloud") cloudSet("meta/library"); }
function saveProject(p){ mirrorLocal(); if(MODE==="cloud") cloudSet("projects/"+p.id); }
function delProjectDoc(id){ mirrorLocal(); if(MODE==="cloud") cloudDel("projects/"+id); }
function saveDay(d){ if(!d)return; mirrorLocal(); if(MODE==="cloud") cloudSet("days/"+d.id); }
function delDayDoc(id){ mirrorLocal(); if(MODE==="cloud") cloudDel("days/"+id); }

function rebuild(path){ if(path==="meta/library")return libraryDoc(); const seg=path.split("/");
  if(seg[0]==="projects"){ const p=S.projects.find(x=>x.id===seg[1]); return p?projDoc(p):null; }
  if(seg[0]==="days"){ const d=S.days.find(x=>x.id===seg[1]); return d?dayDoc(d):null; } return null; }
function cloudSet(path){ if(MODE!=="cloud"||!DBc)return; pending[path]="set"; setSync("syncing"); clearTimeout(wTimers[path]);
  wTimers[path]=setTimeout(()=>{ const obj=rebuild(path); if(!obj){ delete pending[path]; return afterWrite(); }
    DBc.doc(path).set(clean(obj)).then(()=>{ if(pending[path]==="set")delete pending[path]; afterWrite(); }).catch(()=>{ setSync("offline"); }); },350); }
function cloudDel(path){ if(MODE!=="cloud"||!DBc)return; pending[path]="del"; setSync("syncing");
  DBc.doc(path).delete().then(()=>{ if(pending[path]==="del")delete pending[path]; afterWrite(); }).catch(()=>{ setSync("offline"); }); }
function afterWrite(){ if(Object.keys(pending).length===0) setSync("synced"); }
function flush(){ if(MODE!=="cloud"||!DBc)return; const keys=Object.keys(pending); if(!keys.length){ afterWrite(); return; } setSync("syncing");
  keys.forEach(path=>{ const op=pending[path];
    if(op==="del"){ DBc.doc(path).delete().then(()=>{ if(pending[path]==="del")delete pending[path]; afterWrite(); }).catch(()=>{}); }
    else { const obj=rebuild(path); if(!obj){ delete pending[path]; afterWrite(); return; } DBc.doc(path).set(clean(obj)).then(()=>{ if(pending[path]==="set")delete pending[path]; afterWrite(); }).catch(()=>{}); } }); }

function setSync(state){ const c=$("#syncChip"), t=$("#syncTxt"); if(!c)return; c.className="syncchip "+state;
  const n=Object.keys(pending).length;
  t.textContent = state==="local"?"Local only": state==="syncing"?"Syncing…": state==="offline"?("Offline"+(n?" · "+n:"")): "Synced"; }

  : `<p><b>Local only.</b> This copy stores data on this device and does not sync. It’s the offline/field copy.</p>

async function handlePhotos(files){ const d=curDay(); if(!d)return; let n=0;
  for(const f of files){ if(!f.type.startsWith("image/"))continue; try{ const blob=await compress(f);
    if(MODE==="cloud"&&ASSETSc){ const r=await ASSETSc.upload(blob,{type:"image/jpeg"}); photoURLs[r.id]=r.url; d.photos.push({aid:r.id,title:"",desc:""}); }
    else { const id=uid(); await IDB.set("photos",id,blob); photoURLs[id]=URL.createObjectURL(blob); d.photos.push({id,title:"",desc:""}); }
    n++; }catch(e){ console.warn(e); toast("A photo couldn’t be added"); } }
  if(n){ saveDay(d); render(); toast(n+" photo"+(n>1?"s":"")+" added — tap to caption"); } }
function compress(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const max=1400; let w=img.width,h=img.height; if(w>h&&w>max){h=h*max/w;w=max;} else if(h>max){w=w*max/h;h=max;}
    const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error("compress")),"image/jpeg",0.8); }; img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));}; img.src=url; }); }

async function getPhotoBlob(p){ try{ if(p.aid){ const r=await fetch("/_blob/"+p.aid); if(r.ok)return await r.blob(); } if(p.id){ return await IDB.get("photos",p.id); } }catch(e){} return null; }
A["ai-scope"]=async(el)=>{ if(!SAMPLEc)return; const ta=$("#scrim").querySelector('[data-m="desc"]'); const txt=(ta.value||"").trim();
  if(!txt){ toast("Type a few words first"); return; } el.disabled=true; const old=el.textContent; el.textContent="✨ Thinking…";
  try{ const r=await SAMPLEc("You are writing ONE line of the Scope of Works in a daily site log for Ndrasal Electrical Service (NES), a licensed electrical contractor in Papua New Guinea. Rewrite the electrician's shorthand below into a single concise, professional scope line using correct AS/NZS 3000 electrical terminology. Keep it factual and specific; do not invent work that isn't implied. Return ONLY the rewritten line — no preamble, quotes, or bullet.\n\nShorthand: "+txt,{modelTier:"quick"});
    if(r&&r.text){ ta.value=r.text.trim().replace(/^["'\s]+|["'\s]+$/g,""); } }catch(e){ toast(e&&e.code==="rate_limited"?"AI busy — try again in a moment":"AI unavailable (needs internet)"); }
  el.disabled=false; el.textContent=old; };
A["ai-caption"]=async(el)=>{ if(!SAMPLEc)return; const key=el.dataset.id; const d=curDay(); const p=d&&d.photos.find(x=>(x.aid||x.id)===key); if(!p)return;
  el.disabled=true; const old=el.textContent; el.textContent="✨ Looking…";
  try{ let lim; try{ lim=await SAMPLEc.limits(); }catch(e){ lim={images:true}; }
    if(!lim.images){ toast("Photo AI isn't available here"); throw 0; }
    const blob=await getPhotoBlob(p); if(!blob) throw 0;
    const r=await SAMPLEc.json("This is a site photograph from an electrical job by Ndrasal Electrical Service (NES) in PNG, for the Daily Site Log. Look at the image and return JSON exactly as {\"title\": string, \"description\": string}. title = a short 4–8 word caption. description = one or two factual sentences in professional AS/NZS electrical terms noting what is shown and any visible defect or condition and its likely consequence. Only describe what is visibly present; do not invent detail.",{images:[blob],modelTier:"default"});
    if(r){ const t=$("#scrim").querySelector('[data-m="title"]'), ds=$("#scrim").querySelector('[data-m="desc"]');
      if(r.title&&t)t.value=String(r.title).trim(); if(r.description&&ds)ds.value=String(r.description).trim(); toast("Caption suggested — edit as needed"); } }
  catch(e){ if(e&&e.code) toast(e.code==="rate_limited"?"AI busy — try again":"Couldn’t read the photo"); else if(e!==0) toast("Couldn’t read the photo"); }
  el.disabled=false; el.textContent=old; };

/* ---------- export / backup ---------- */
async function doDownload(name,text){ if(DLc){ try{ await DLc.save({filename:name,data:text}); return true; }catch(e){ if(e&&e.code==="declined")return true; } }
  try{ const b=new Blob([text],{type:"application/json"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); return true; }catch(e){ return false; } }
function projectData(){ const ap=activeProject(); if(!ap)return null; return {company:S.company,rateCard:S.rateCard,project:ap,days:daysOf(ap.id).map(d=>({...d,labour:(d.labour||[]).map(l=>({...l,hours:netHrs(l.in,l.out,l.brk),shift:shiftStr(l.in,l.out,l.brk)}))}))}; }
A["export-json"]=async()=>{ const d=projectData(); if(!d){toast("No active project");return;} const ok=await doDownload((activeProject().jobNo||"project")+"_data.json",JSON.stringify(d,null,2)); toast(ok?"JSON exported":"Use Copy JSON instead"); };
A["copy-json"]=async()=>{ const d=projectData(); if(!d){toast("No active project");return;} try{ await navigator.clipboard.writeText(JSON.stringify(d,null,2)); toast("JSON copied"); }catch(e){ showText("Project JSON",JSON.stringify(d,null,2)); } };
function showText(title,text){ openModal(title,`<textarea style="min-height:220px" readonly>${esc(text)}</textarea>`,()=>{closeModal();},"Done"); }
function blobToDataURL(b){ return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); }); }
function dataURLtoBlob(u){ const [h,d]=u.split(","); const mime=(h.match(/:(.*?);/)||[])[1]||"image/jpeg"; const bin=atob(d); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return new Blob([a],{type:mime}); }
async function fullBackup(){ const out={_nes_backup:1,mode:MODE,at:new Date().toISOString(),state:clean(S)};
  if(MODE!=="cloud"){ const photos=await IDB.allPhotos(); const pd={}; for(const k in photos){ pd[k]=await blobToDataURL(photos[k]); } out.photos=pd; } return JSON.stringify(out); }

  else { try{ const old=await IDB.allPhotos(); for(const k in old)IDB.del("photos",k); }catch(e){} Object.keys(photoURLs).forEach(k=>delete photoURLs[k]);

async function photoToDataURL(p){ try{ if(p.aid){ const r=await fetch("/_blob/"+p.aid); if(r.ok) return await blobToDataURL(await r.blob()); } if(p.id){ const b=await IDB.get("photos",p.id); if(b) return await blobToDataURL(b); } }catch(e){} return null; }
async function exportProjectBundle(){ const ap=activeProject(); if(!ap)return null; const days=daysOf(ap.id).map(d=>clean(d)); const photos={};
  for(const d of days){ for(const p of (d.photos||[])){ const key=p.aid||p.id; if(key&&!photos[key]){ const du=await photoToDataURL(p); if(du)photos[key]=du; } } }
  return {_nes_project:1,at:new Date().toISOString(),project:clean(ap),days,photos}; }

async function importProjectBundle(obj){ if(!obj||!obj.project||!Array.isArray(obj.days)){ toast("Not a valid project file"); return; }
  const src=obj.project; let target=S.projects.find(p=>p.id===src.id)||S.projects.find(p=>p.jobNo&&src.jobNo&&p.jobNo===src.jobNo); let pid;
  if(target){ pid=target.id; Object.assign(target,src,{id:pid}); if(target.sample)delete target.sample; }
  else { pid=src.id||uid(); if(S.projects.some(p=>p.id===pid))pid=uid(); target=Object.assign({},src,{id:pid}); delete target.sample; S.projects.push(target); }
  saveProject(target);
  for(const sd of obj.days){ const nd=clean(sd); nd.projectId=pid; const np=[];
    for(const p of (nd.photos||[])){ const key=p.aid||p.id; const du=obj.photos&&obj.photos[key]; if(du){ const blob=dataURLtoBlob(du);
        if(MODE==="cloud"&&ASSETSc){ try{ const r=await ASSETSc.upload(blob,{type:"image/jpeg"}); photoURLs[r.id]=r.url; np.push({aid:r.id,title:p.title||"",desc:p.desc||""}); continue; }catch(e){} }
        const nid=uid(); try{ await IDB.set("photos",nid,blob); photoURLs[nid]=URL.createObjectURL(blob); }catch(e){} np.push({id:nid,title:p.title||"",desc:p.desc||""}); }
      else np.push({title:p.title||"",desc:p.desc||""}); }
    nd.photos=np; nd.id=sd.id||uid(); const ex=S.days.find(x=>x.id===nd.id); if(ex){ Object.assign(ex,nd); saveDay(ex); } else { S.days.push(nd); saveDay(nd); } }
  ui.projectId=pid; ui.tab="log"; ui.dayId=null; mirrorLocal(); render(); toast("Project imported — merged into your projects"); }

function money(n){ return "K "+(Math.round((+n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function roleRate(role){ const r=S.rateCard.find(x=>x.role===role); return r&&r.rate!=null?+r.rate:0; }
function computeInvoice(ap){ const days=daysOf(ap.id); const byRole={};
  days.forEach(d=>(d.labour||[]).forEach(l=>{ const n=netHrs(l.in,l.out,l.brk)||0; const role=l.role||"Unspecified"; if(!byRole[role])byRole[role]={hours:0,workers:new Set()}; byRole[role].hours+=n; byRole[role].workers.add((l.personId||l.name||Math.random()).toString().toLowerCase()); }));
  const inv=ap.invoice||{}; const sow1=Object.keys(byRole).map(role=>{ const h=byRole[role].hours,w=byRole[role].workers.size||1,rate=roleRate(role); return {role,hours:h,workers:w,rate,amount:h*rate}; });
  const sow1Total=sow1.reduce((s,x)=>s+x.amount,0);
  const materials=+inv.materials||0, commission=+inv.commission||0, margins=+inv.margins||0, tools=+inv.tools||0;
  const vDays=+inv.vehicleDays||0, vRate=+inv.vehicleRate||0, logistics=vDays*vRate;
  const subtotal=sow1Total+materials+commission+margins+tools+logistics; const gst=subtotal*0.10; const total=subtotal+gst;
  return {days,sow1,sow1Total,materials,commission,margins,tools,vDays,vRate,logistics,subtotal,gst,total,inv}; }

/* ---------- completion report ---------- */
function computeReport(ap){ const days=daysOf(ap.id); const dts=days.map(d=>d.date).filter(Boolean).sort();
  const period=dts.length?`${fmtDate(dts[0])} – ${fmtDate(dts[dts.length-1])}`:"—";
  const byRole={}; days.forEach(d=>(d.labour||[]).forEach(l=>{ const n=netHrs(l.in,l.out,l.brk)||0; const role=l.role||"Unspecified"; if(!byRole[role])byRole[role]={hours:0,names:new Set()}; byRole[role].hours+=n; if(l.name)byRole[role].names.add(l.name); }));
  const labour=Object.keys(byRole).map(role=>({role,hours:byRole[role].hours,names:[...byRole[role].names]}));
  const grandHrs=labour.reduce((s,x)=>s+x.hours,0);
  const mat={}; days.forEach(d=>(d.materials||[]).forEach(m=>{ const k=m.item; if(!mat[k])mat[k]={item:k,qty:0,unit:m.unit||"",numeric:true}; const q=parseFloat(m.qty); if(isNaN(q))mat[k].numeric=false; else mat[k].qty+=q; }));
  const materials=Object.values(mat);
  const tset=new Set(); days.forEach(d=>(d.scope||[]).forEach(s=>{ if(/test|megger|rcd|commission|energis|load|phase|earth|insulation/i.test(s.desc))tset.add(s.desc); }));
  const photos=[]; days.forEach(d=>(d.photos||[]).forEach(p=>photos.push(p)));
  return {days,period,labour,grandHrs,materials,testing:[...tset],photos}; }
A["report-setup"]=()=>{ const ap=activeProject(); if(!ap){toast("No active project");return;} const r=ap.report||{};
  openModal("Report inputs",
    field("Report Ref. No.","refNo",r.refNo,"","NES-RPT-00-26")+field("Report date","date",r.date||todayISO(),"date")+field("Status","status",r.status||"Works complete — energised & commissioned")
    +`<div class="field"><label>Executive summary</label><textarea data-m="execSummary" style="min-height:110px" placeholder="Overview of the works completed…">${esc(r.execSummary||"")}</textarea></div>${aiBtn("ai-report-exec","Draft summary with AI")}
      <div class="field"><label>Conclusion</label><textarea data-m="conclusion" style="min-height:90px" placeholder="Closing statement…">${esc(r.conclusion||"")}</textarea></div>${aiBtn("ai-report-concl","Draft conclusion with AI")}`,

A["gen-report"]=()=>{ const ap=activeProject(); if(!ap){toast("No active project");return;} $("#pvTitle").textContent="Completion Report"; buildReport(ap); $("#printview").style.display="block"; document.body.style.overflow="hidden"; };
async function aiDraft(el,field,build){ if(!SAMPLEc)return; const ap=activeProject(); const R=computeReport(ap); const ta=$("#scrim").querySelector(`[data-m="${field}"]`);
  el.disabled=true; const old=el.textContent; el.textContent="✨ Drafting…";
  try{ const r=await SAMPLEc(build(ap,R),{modelTier:"default"}); if(r&&r.text)ta.value=r.text.trim(); }catch(e){ toast(e&&e.code==="rate_limited"?"AI busy — try again":"AI unavailable (needs internet)"); }
  el.disabled=false; el.textContent=old; }
A["ai-report-exec"]=(el)=>aiDraft(el,"execSummary",(ap,R)=>{ const sc=[...new Set(R.days.flatMap(d=>(d.scope||[]).map(s=>s.desc)))].slice(0,14).join("; ");
  return `Draft a concise 1–2 paragraph Executive Summary for an Electrical Works Completion Report by Ndrasal Electrical Service (NES), a licensed electrical contractor in Papua New Guinea. Factual and professional, AS/NZS 3000 terminology, no bullet points. Return only the summary text.\n\nProject: ${ap.name}\nClient: ${ap.client||""}\nLocation: ${ap.location||""}\nWorks period: ${R.period} (${R.days.length} days)\nTotal labour hours: ${R.grandHrs.toFixed(1)}\nKey scope performed: ${sc}`; });
A["ai-report-concl"]=(el)=>aiDraft(el,"conclusion",(ap,R)=>`Draft a short, professional Conclusion (2–4 sentences) for an Electrical Works Completion Report by Ndrasal Electrical Service for ${ap.client||"the Client"} on project "${ap.name}". State that the works are complete and recorded, in AS/NZS 3000 terms, and thank the client. Return only the conclusion text.`);
function buildReport(ap){ const c=S.company, R=computeReport(ap), r=ap.report||{}; const roles=R.labour.length;
  const exec=r.execSummary||`Over ${R.days.length} day(s) (${R.period}), Ndrasal Electrical Service carried out and completed the electrical works for ${ap.client||"the Client"} at ${ap.location||"site"}. A total of ${R.grandHrs.toFixed(1)} labour hours were expended across ${roles} trade${roles===1?"":"s"}. The works were executed, tested and recorded in accordance with AS/NZS 3000 Wiring Rules.`;
  const concl=r.conclusion||`The electrical works described in this report have been completed and recorded against the Daily Site Works Log ${ap.logSheetNo||""}. NES thanks ${ap.client||"the Client"} for the opportunity to deliver these works.`;
  const dayRows=R.days.map(d=>{ const dn=d.date?new Date(d.date+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short"}):""; const sc=(d.scope||[]).map(s=>s.desc).join("; ")||"—"; return `<tr><td class="mono" style="white-space:nowrap">${esc(d.date||"")}</td><td>${esc(dn)}</td><td>${esc(sc)}</td><td class="mono" style="text-align:right">${dayTotal(d).toFixed(1)}</td></tr>`; }).join("")||`<tr><td colspan="4" style="color:#8a98b3">No days logged.</td></tr>`;
  const labRows=R.labour.map(l=>`<tr><td>${esc(l.role)}</td><td>${esc(l.names.join(", "))}</td><td class="mono" style="text-align:right">${l.hours.toFixed(1)}</td></tr>`).join("")||`<tr><td colspan="3" style="color:#8a98b3">No labour logged.</td></tr>`;
  const matRows=R.materials.map(m=>`<tr><td>${esc(m.item)}</td><td class="mono" style="text-align:right">${m.numeric&&m.qty?m.qty:""}</td><td>${esc(m.unit||"")}</td></tr>`).join("")||`<tr><td colspan="3" style="color:#8a98b3">No materials recorded.</td></tr>`;
  const testHtml=R.testing.length?`<ul style="margin:6px 0 0;padding-left:18px;font-size:11.5px">${R.testing.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:`<p style="margin:4px 0 0;color:#5d6e8c;font-size:11.5px">Testing and commissioning activities are recorded within the daily scope above.</p>`;
  const photoHtml=R.photos.length?`<div class="pgrid">${R.photos.map(p=>`<div class="pcell"><img src="${pSrc(p)}"><div class="pc"><b>${esc(p.title||"Site photo")}</b>${esc(p.desc||"")}</div></div>`).join("")}</div>`:`<p style="color:#5d6e8c;font-size:11.5px">No photographs recorded.</p>`;
  $("#lsBody").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:3px solid #2e5496;padding-bottom:10px">
      <div><h1>${esc(c.name)}</h1><div style="color:#2e5496;font-style:italic;font-size:11px">${esc(c.tagline)}</div><div class="lead">${esc(c.location)} · ${esc(c.phone)}</div></div>
      <div style="text-align:right;font-size:10px;color:#5d6e8c">${esc(c.licence)}<br>${esc(c.ipa)} · ${esc(c.tin)}<br>${esc(c.gst)}</div></div>
    <div style="background:#1f3864;color:#fff;text-align:center;padding:12px;border-radius:8px;margin-top:14px"><div style="font-weight:700;font-size:16px">ELECTRICAL WORKS COMPLETION REPORT</div><div style="font-size:11px;color:#c9d6ef;margin-top:3px">${esc(ap.name)}</div></div>
    <div class="block"><table style="width:100%;font-size:11.5px"><tr><td style="padding:2px 6px"><b>Client</b></td><td style="padding:2px 6px">${esc(ap.client||"—")}</td><td style="padding:2px 6px"><b>Report Ref.</b></td><td style="padding:2px 6px">${esc(r.refNo||"—")}</td></tr>
      <tr><td style="padding:2px 6px"><b>Project</b></td><td style="padding:2px 6px">${esc(ap.name)}</td><td style="padding:2px 6px"><b>Job / Contract</b></td><td style="padding:2px 6px">${esc(ap.jobNo||"—")}</td></tr>
      <tr><td style="padding:2px 6px"><b>Location</b></td><td style="padding:2px 6px">${esc(ap.location||"—")}</td><td style="padding:2px 6px"><b>Log Sheet No.</b></td><td style="padding:2px 6px">${esc(ap.logSheetNo||"—")}</td></tr>
      <tr><td style="padding:2px 6px"><b>Works period</b></td><td style="padding:2px 6px">${esc(R.period)}</td><td style="padding:2px 6px"><b>Date of issue</b></td><td style="padding:2px 6px">${esc(r.date?fmtDate(r.date):"—")}</td></tr>
      <tr><td style="padding:2px 6px"><b>Status</b></td><td style="padding:2px 6px" colspan="3"><b style="color:#2f7d4f">${esc(r.status||"Works complete")}</b></td></tr></table></div>
    <div class="secbar">1.0  Executive Summary</div><div style="font-size:12px;white-space:pre-wrap">${esc(exec)}</div>
    <div class="secbar">2.0  Scope of Works Executed</div>${tbl(["Date","Day","Scope of works carried out","Hrs"],dayRows)}
    <div class="secbar">3.0  Labour Resources</div>${tbl(["Trade / Role","Personnel","Total hrs"],labRows)}<div style="text-align:right;font-weight:700;color:#1f3864;font-size:12px;padding:5px 8px 0">Total labour hours: <span class="mono">${R.grandHrs.toFixed(1)}</span></div>
    <div class="secbar">4.0  Materials, Plant &amp; Equipment</div>${tbl(["Item","Qty","Unit"],matRows)}
    <div class="secbar">5.0  Testing &amp; Commissioning</div>${testHtml}
    <div class="secbar">6.0  Photographic Records</div>${photoHtml}
    <div class="secbar">7.0  Conclusion</div><div style="font-size:12px;white-space:pre-wrap">${esc(concl)}</div>
    <div class="sign" style="grid-template-columns:1fr 1fr 1fr"><div><div class="sg">Prepared by:<br><b>${esc((ap.signoff&&ap.signoff.preparedBy)||ap.supervisor||"LILAN M. PEMBU")}</b><br><span style="color:#5d6e8c">${esc((ap.signoff&&ap.signoff.preparedRole)||"Site Supervisor / Licensed Electrician")}</span></div></div>
      <div><div class="sg">Reviewed by:<br><b>PETER P. NDRASAL</b><br><span style="color:#5d6e8c">Managing Director / Licensed Electrician</span></div></div>
      <div><div class="sg">Received by:<br><b>${esc((ap.signoff&&ap.signoff.clientRep)||"The Provincial Administrator")}</b><br><span style="color:#5d6e8c">${esc(ap.client||"")}</span></div></div></div>
    <div class="foot">${esc(c.name)} — ${esc(c.tagline)} · ${esc(c.licence)} · ${esc(c.tin)} · ${esc(c.gst)}<br>Report Ref: ${esc(r.refNo||"")} · generated ${new Date().toLocaleDateString("en-GB")}</div>`;
}

  if(act==="modal-cancel"){ closeModal(); return; } if(act==="modal-save"){ if(modalSave){ const r=modalSave(); if(r===false)return; } return; }
  const fn=A[act]; if(fn){ e.preventDefault(); fn(el); } });

/* ---------- cloud subscriptions ---------- */
function onSubErr(e){ if(e&&(e.code==="revoked"||e.code==="unavailable"))setSync("offline"); }
function startSubscriptions(){
  subs.push(DBc.doc("meta/library").onSnapshot(s=>{ if(s.exists){ applyLibrary(s.data()); mirrorLocal(); syncRender(); } }, onSubErr));
  subs.push(DBc.collection("projects").onSnapshot(q=>{ S.projects=q.docs.map(d=>Object.assign({id:d.id},d.data())); mirrorLocal(); if(!q.metadata.fromCache&&!Object.keys(pending).length)setSync("synced"); syncRender(); }, onSubErr));
  subs.push(DBc.collection("days").onSnapshot(q=>{ S.days=q.docs.map(d=>Object.assign({id:d.id},d.data())); mirrorLocal(); if(!q.metadata.fromCache&&!Object.keys(pending).length)setSync("synced"); syncRender(); }, onSubErr));
}

/* ---------- boot ---------- */
async function hydratePhotos(){ try{ const all=await IDB.allPhotos(); Object.keys(all).forEach(k=>{ if(!photoURLs[k]) photoURLs[k]=URL.createObjectURL(all[k]); }); }catch(e){} }
async function boot(){
  // 1) Local cache — never let a stalled IndexedDB freeze startup.
  try{ await withTimeout(IDB.open(),2000); }catch(e){ memCache=true; IDB._db=null; }
  if(!memCache){ try{ S=await withTimeout(IDB.get("kv","state"),2000); }catch(e){ S=null; } }
  // 2) Claude capabilities — only present inside claude.ai; each call time-boxed.
  const C=window.claude;
  if(C&&typeof C.use==="function"){
    try{ DBc=await withTimeout(C.use("db"),8000); }catch(e){ DBc=null; }
    try{ USERc=await withTimeout(C.use("user"),8000); }catch(e){}
    try{ ASSETSc=await withTimeout(C.use("assets"),8000); }catch(e){}
    try{ DLc=await withTimeout(C.use("downloads"),8000); }catch(e){}
    try{ SAMPLEc=await withTimeout(C.use("sample"),8000); AI=!!SAMPLEc; }catch(e){}
  }
  if(DBc) MODE="cloud";
  // 3) Always have state, and ALWAYS render the UI.
  if(!S){ S = (MODE==="cloud") ? emptyState() : seed(); }
  ensureDefaults(S);
  if(MODE!=="cloud" && !memCache) mirrorLocal();
  setSync(MODE==="cloud"?"syncing":"local");
  render();
  // 4) Background work that must never block first paint.
  hydratePhotos().catch(()=>{});
  if(MODE==="cloud"){ try{ startSubscriptions(); }catch(e){} window.addEventListener("online",flush); setInterval(()=>{ if(Object.keys(pending).length)flush(); },15000); }
  else if(memCache){ const b=document.createElement("div"); b.className="note warnnote"; b.textContent="This device is blocking local storage, so saved work won’t persist after you close the app. Export a backup to be safe."; app.prepend(b); }
}
boot().catch(function(e){
  // Last-resort: guarantee a usable app even if boot throws.
  try{ if(!S){ S=seed(); ensureDefaults(S); } MODE="local"; setSync("local"); render(); }catch(_){
    document.getElementById("app").innerHTML='<div style="padding:24px;text-align:center"><p style="font-weight:600">Couldn’t start the app.</p><p class="muted small">Close it fully and reopen. If it keeps happening, reinstall from the link.</p></div>'; }
});
})();
